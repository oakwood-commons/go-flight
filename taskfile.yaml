# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  NAME: "go-flight"
  DESCRIPTION: "A generic singleflight library for Go with leader/follower execution and multi-tier caching"
  DEFAULT_GO_VERSION: "1.26.0"
  GOLANGCI_LINT_VERSION: "v2.13.2"
  GOFUMPT_VERSION: "v0.9.2"
  GOIMPORTS_VERSION: "v0.42.0"
  GOVULNCHECK_VERSION: "v1.7.0"
  TOOLS: "{{.ROOT_DIR | toSlash}}/.tool"
  TOOLS_BIN: "{{.TOOLS}}"
  PATH_SEP: "{{ if eq OS `windows` }};{{ else }}:{{ end }}"
  TOOLS_PATH: "{{.TOOLS_BIN}}{{.PATH_SEP}}{{ env `PATH` }}"
  COVER: "{{.ROOT_DIR | toSlash}}/.task/cover"
  DEFAULT_GOCACHE: "{{.ROOT_DIR | toSlash}}/.gocache"
  HAS_CC:
    sh: command -v "$(go env CC)" >/dev/null 2>&1 && echo true || echo false
  RACE_FLAG: '{{ if eq .HAS_CC "true" }}-race{{ end }}'
  GO_VERSION:
    sh: |
      if [ -f go.mod ]; then
        v="$(awk '/^toolchain[[:space:]]+go/ {print $2}' go.mod | tr -d '\r' | sed 's/^go//')"
        if [ -n "$v" ]; then
          echo "$v"
        else
          awk '/^go[[:space:]]+/ {print $2; exit}' go.mod | tr -d '\r'
        fi
      else
        echo "{{.DEFAULT_GO_VERSION}}"
      fi
  GOTOOLCHAIN: "go{{.GO_VERSION}}"

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: "{{.GOTOOLCHAIN}}"
  GOCACHE: "{{ env `GOCACHE` | default .DEFAULT_GOCACHE }}"
  GOWORK: "off"
  GOLANGCI_LINT_CACHE: "{{.ROOT_DIR}}/.cache/golangci-lint"
  GOBIN: "{{.TOOLS_BIN}}"

tasks:
  # ──────────────────────────────────────────────────────────────────────────────
  # Info
  # ──────────────────────────────────────────────────────────────────────────────

  default:
    aliases:
      - info
    silent: true
    desc: Display build and environment information
    cmds:
      - |
        echo "------------------------------------------------------------"
        echo "go-flight Taskfile Information"
        echo "------------------------------------------------------------"
        echo "Usage:"
        echo "  task            # Prints this info section"
        echo "  task test       # Tests the code"
        echo "  task lint       # Lints the code"
        echo "  task ci         # Full CI pipeline"
        echo "  task coverage   # Generate coverage report"
        echo "------------------------------------------------------------"

  # ──────────────────────────────────────────────────────────────────────────────
  # Modules
  # ──────────────────────────────────────────────────────────────────────────────

  mod:
    desc: Downloads and tidy Go modules (only if needed)
    silent: true
    sources:
      - go.mod
      - go.sum
    cmds:
      - go mod download
      - go mod tidy

  mod:check:
    desc: "Check if go.mod and go.sum are in sync (fails if go mod tidy is needed)"
    silent: true
    cmds:
      - |
        set -e
        TMPDIR=$(mktemp -d)
        trap 'rm -rf "$TMPDIR"' EXIT
        cp go.mod "$TMPDIR/go.mod"
        cp go.sum "$TMPDIR/go.sum"

        go mod tidy

        if diff -q go.mod "$TMPDIR/go.mod" > /dev/null 2>&1 && diff -q go.sum "$TMPDIR/go.sum" > /dev/null 2>&1; then
          echo "✅ go.mod and go.sum are tidy"
          exit 0
        fi

        cp "$TMPDIR/go.mod" go.mod
        cp "$TMPDIR/go.sum" go.sum
        echo "❌ go.mod and go.sum need tidying"
        echo "Run 'task mod' or 'go mod tidy' to fix."
        exit 1

  mod:verify:
    desc: "Verify Go module integrity and checksums"
    silent: true
    cmds:
      - go mod verify
      - go mod download

  # ──────────────────────────────────────────────────────────────────────────────
  # Tool Installation
  # ──────────────────────────────────────────────────────────────────────────────

  install-tools:
    desc: "Install all development tools (Go)"
    silent: true
    run: once
    env:
      GOBIN: "{{.TOOLS_BIN}}"
    cmds:
      - |
        set -e
        export PATH="{{.TOOLS_BIN}}:$PATH"

        mkdir -p "{{.TOOLS_BIN}}"

        install_tool() {
          local name="$1"
          local pkg="$2"

          if ! command -v "$name" >/dev/null 2>&1; then
            echo "[install] $name"
            go install "$pkg"
          fi
        }

        install_tool golangci-lint "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}"
        install_tool govulncheck "golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}"
        install_tool gofumpt "mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}"
        install_tool goimports "golang.org/x/tools/cmd/goimports@{{.GOIMPORTS_VERSION}}"

  # ──────────────────────────────────────────────────────────────────────────────
  # Formatting
  # ──────────────────────────────────────────────────────────────────────────────

  format:
    desc: "Auto-format Go code (goimports + gofumpt) and tidy modules"
    deps: [install-tools]
    silent: true
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    cmds:
      - |
        set -e
        export PATH="{{.TOOLS_PATH}}:$PATH"

        echo "Formatting Go files..."
        find . -type f -name '*.go' \
          -not -path './.cache/*' \
          -not -path './.task/*' \
          -not -path './.gocache/*' \
          -not -path './.tool/*' \
          -print0 \
          | xargs -0 goimports -w

        find . \
          -type d \( -name .gocache -o -name .cache -o -name .task -o -name .tool \) -prune -false \
          -o -type f -name '*.go' -print \
          | xargs gofumpt -w -extra

        go mod tidy

        echo "✅ Formatting complete"

  format:check:
    desc: "Check if Go code is properly formatted (fails if formatting is needed)"
    deps: [install-tools]
    silent: true
    sources:
      - "**/*.go"
    cmds:
      - |
        set -e
        export PATH="{{.TOOLS_PATH}}:$PATH"

        changes=0

        UNFORMATTED=$(find . \
          -type d \( -name .gocache -o -name .cache -o -name .task -o -name .tool \) -prune -false \
          -o -type f -name '*.go' -print0 \
          | xargs -0 goimports -l 2>/dev/null || true)

        if [ -n "$UNFORMATTED" ]; then
          echo "❌ goimports formatting issues:"
          echo "$UNFORMATTED"
          changes=1
        fi

        UNFORMATTED=$(find . \
          -type d \( -name .gocache -o -name .cache -o -name .task -o -name .tool \) -prune -false \
          -o -type f -name '*.go' -print0 \
          | xargs -0 gofumpt -l -extra 2>/dev/null || true)

        if [ -n "$UNFORMATTED" ]; then
          echo "❌ gofumpt formatting issues:"
          echo "$UNFORMATTED"
          changes=1
        fi

        if [ "$changes" -ne 0 ]; then
          echo "Run 'task format' to apply formatting."
          exit 1
        fi
        echo "✅ Code formatting is correct"

  # ──────────────────────────────────────────────────────────────────────────────
  # Linting & Static Analysis
  # ──────────────────────────────────────────────────────────────────────────────

  lint:
    desc: "Runs golangci-lint (fails if any linting issues are found)"
    aliases: [l]
    silent: true
    deps: [install-tools]
    sources:
      - "./**/*.go"
      - .golangci.yml
    cmds:
      - |
        set -e
        export PATH="{{.TOOLS_PATH}}:$PATH"

        echo "Running golangci-lint..."
        mkdir -p "{{.GOLANGCI_LINT_CACHE}}"
        golangci-lint run ./... --config .golangci.yml --timeout 10m0s
        echo "✅ No linting issues found"

  vet:
    desc: "Run go vet (static checks from the Go toolchain)"
    silent: true
    sources:
      - "./**/*.go"
      - go.mod
      - go.sum
    cmds:
      - go vet ./...

  lint:fix:
    desc: "Runs golangci-lint and fixes any issues"
    deps: [install-tools]
    silent: true
    sources:
      - "./**/*.go"
      - .golangci.yml
    cmds:
      - |
        export PATH="{{.TOOLS_PATH}}:$PATH"
        mkdir -p "{{.GOLANGCI_LINT_CACHE}}"
        golangci-lint run --fix

  # ──────────────────────────────────────────────────────────────────────────────
  # Security
  # ──────────────────────────────────────────────────────────────────────────────

  vulncheck:
    desc: "Check for known vulnerabilities in dependencies (requires Go 1.18+)"
    silent: true
    deps: [install-tools]
    cmds:
      - |
        export PATH="{{.TOOLS_PATH}}:$PATH"
        govulncheck ./...
    sources:
      - "**/*.go"
      - go.mod
      - go.sum

  # ──────────────────────────────────────────────────────────────────────────────
  # Testing
  # ──────────────────────────────────────────────────────────────────────────────

  test:
    desc: "Runs test suite"
    aliases: [t]
    env:
      GOFLAGS: '{{.GOFLAGS | default "-count=1"}}'
      GOTESTFLAGS: '{{.GOTESTFLAGS | default "-shuffle=on"}}'
    cmds:
      - go test $GOTESTFLAGS -timeout 10m ./...
    sources:
      - "**/*.go"
      - go.mod
      - go.sum

  test:race:
    desc: "Run tests with race detector enabled"
    preconditions:
      - sh: '[ "{{.HAS_CC}}" = "true" ]'
        msg: "Skipping race tests: no C compiler found -- race detector requires cgo"
    env:
      GOFLAGS: '{{.GOFLAGS | default "-count=1"}}'
      GOTESTFLAGS: '{{.GOTESTFLAGS | default "-shuffle=on"}}'
    cmds:
      - go test $GOTESTFLAGS -race -timeout 10m ./...
    sources:
      - "**/*.go"
      - go.mod
      - go.sum

  # ──────────────────────────────────────────────────────────────────────────────
  # Coverage
  # ──────────────────────────────────────────────────────────────────────────────

  coverage:
    desc: "Generate test coverage profile"
    silent: true
    cmds:
      - mkdir -p {{.COVER}}
      - go test ./... -coverprofile={{.COVER}}/cover.out -covermode=atomic -coverpkg=./...
    sources:
      - "**/*.go"
      - go.mod
      - go.sum

  coverage:report:
    desc: "Print detailed test coverage report per-file"
    silent: true
    deps: [coverage]
    cmds:
      - go tool cover -func={{.COVER}}/cover.out

  coverage:check:
    desc: "Check if test coverage meets minimum threshold (default: 70.0%)"
    silent: true
    deps: [coverage]
    vars:
      COVERAGE_THRESHOLD: '{{ .COVERAGE_THRESHOLD | default "70.0" }}'
    cmds:
      - |
        set -e
        TOTAL=$(go tool cover -func={{.COVER}}/cover.out | awk '/^total:/ {print $NF}' | tr -d '%')
        echo "Total coverage: ${TOTAL}%"
        echo "Threshold:      {{.COVERAGE_THRESHOLD}}%"
        if awk "BEGIN {exit !(${TOTAL} < {{.COVERAGE_THRESHOLD}})}"; then
          echo "❌ Coverage ${TOTAL}% is below threshold {{.COVERAGE_THRESHOLD}}%"
          exit 1
        fi
        echo "✅ Coverage meets threshold"

  coverage:html:
    desc: "Generate HTML coverage report and open in browser"
    silent: true
    deps: [coverage]
    cmds:
      - go tool cover -html={{.COVER}}/cover.out -o {{.COVER}}/coverage.html
      - |
        echo "✅ HTML report generated at {{.COVER}}/coverage.html"
        if command -v open >/dev/null 2>&1; then
          open {{.COVER}}/coverage.html
        elif command -v xdg-open >/dev/null 2>&1; then
          xdg-open {{.COVER}}/coverage.html
        fi

  # ──────────────────────────────────────────────────────────────────────────────
  # Integration Tests
  # ──────────────────────────────────────────────────────────────────────────────

  integration:
    desc: "Run integration tests"
    env:
      CGO_ENABLED: '{{ if eq .HAS_CC "true" }}1{{ else }}0{{ end }}'
    cmds:
      - go test {{.RACE_FLAG}} -count=1 -timeout 5m ./tests/integration/...

  # ──────────────────────────────────────────────────────────────────────────────
  # Benchmarks
  # ──────────────────────────────────────────────────────────────────────────────

  bench:
    desc: "Run all benchmark tests"
    aliases: [b]
    vars:
      BENCH_PATTERN: '{{ .BENCH_PATTERN | default "." }}'
      BENCH_TIME: '{{ .BENCH_TIME | default "1s" }}'
      BENCH_COUNT: '{{ .BENCH_COUNT | default "1" }}'
      BENCH_PKG: '{{ .BENCH_PKG | default "./..." }}'
    cmds:
      - |
        go test -run='^$' -bench='{{.BENCH_PATTERN}}' -benchmem -benchtime={{.BENCH_TIME}} -count={{.BENCH_COUNT}} {{.BENCH_PKG}}
    sources:
      - "**/*.go"
      - go.mod
      - go.sum

  # ──────────────────────────────────────────────────────────────────────────────
  # CI Pipeline
  # ──────────────────────────────────────────────────────────────────────────────

  ci:
    desc: "Comprehensive CI pipeline — all checks, tests, linting, and coverage"
    vars:
      COVERAGE_THRESHOLD: '{{ .COVERAGE_THRESHOLD | default "70.0" }}'
    silent: true
    cmds:
      - |
        set -e

        echo "=========================================="
        echo "🚀 Starting CI Pipeline"
        echo "=========================================="

        echo ""
        echo "✅ Step 1/7: Module Dependencies Check"
        echo "   - Checking go.mod and go.sum are in sync..."
        task mod:check

        echo ""
        echo "✅ Step 2/7: Module Verification"
        echo "   - Verifying module integrity and checksums..."
        task mod:verify

        echo ""
        echo "✅ Step 3/7: Code Formatting Check"
        echo "   - Checking code formatting (goimports + gofumpt)..."
        task format:check

        echo ""
        echo "✅ Step 4/7: Go Vet"
        echo "   - Running go vet..."
        task vet

        echo ""
        echo "✅ Step 5/7: Linting"
        echo "   - Running golangci-lint..."
        task lint

        echo ""
        echo "✅ Step 6/7: Tests"
        echo "   - Running test suite..."
        task test

        echo ""
        echo "✅ Step 7/7: Test Coverage"
        echo "   - Running coverage check (threshold: {{.COVERAGE_THRESHOLD}}%)..."
        COVERAGE_THRESHOLD="{{.COVERAGE_THRESHOLD}}" task coverage:check

        echo ""
        echo "=========================================="
        echo "✅ CI Pipeline Completed Successfully!"
        echo "=========================================="

  # ──────────────────────────────────────────────────────────────────────────────
  # Cleaning
  # ──────────────────────────────────────────────────────────────────────────────

  clean:
    desc: "Clean build artifacts, caches, and temporary files"
    silent: true
    cmds:
      - |
        echo "🧹 Cleaning build artifacts and caches..."

        echo "  📦 Cleaning Go caches..."
        go clean -cache -testcache -fuzzcache

        echo "  📋 Cleaning task cache..."
        rm -rf .task/

        echo "  🗑️  Cleaning files..."
        find ./ -name "*.tmp" -type f -delete
        find ./ -name ".DS_Store" -type f -delete
        find ./ -name "coverage.*" -type f -delete

        echo "✅ Clean complete"
